replicaCount: 1

image:
  repository: ""  # Required: must be set via --set image.repository=...
  pullPolicy: Always
  tag: "61c9ba1"

github:
  pullSecret:
    create: true
    name: ghcr-secret
    registry: ""
    username: ""
    token: ""

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

# The image runs as non-root. No explicit runAsUser — let OpenShift assign a UID
# from the restricted-v2 SCC range.
securityContext:
  runAsNonRoot: true

service:
  type: ClusterIP
  port: 8080

# HTTP path used for startup / readiness probes.
# / serves public/index.html from the oat++ static handler.
probePath: /

route:
  host: ""  # Required for Pomerium ingress — e.g. df-lob.apps-crc.testing

acmeIssuerName: "clusterissuer-primkey-acme"

# Passthrough Route from the OpenShift router to Pomerium for route.host
# (templates/pomerium-route.yaml). Off by default: the Route claims the app
# host on the OpenShift router, which blocks cert-manager's ACME HTTP-01
# solver (HostAlreadyClaimed) so the TLS certificate never issues. Only
# enable it on clusters where Pomerium has no ingress of its own and all
# traffic must arrive via the OpenShift router.
pomerium:
  namespace: pomerium
  service: pomerium-proxy
  route:
    create: false

resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

env: []

argocd: false

openshift:
  # Bind the anyuid SCC to the service account so the pod can run as root.
  # Set to false on non-OpenShift clusters.
  anyuidScc: true
