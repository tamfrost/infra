# ArgoCD Application configuration
argocd:
  # Namespace where ArgoCD is installed
  namespace: openshift-gitops

  # Note: the infra repo must be registered with ArgoCD separately
  # (e.g. via "Connect Repo" in the ArgoCD UI/CLI) — this chart does not
  # create repository-credential Secrets.

  # Application settings
  application:
    # Name of the ArgoCD application
    name: df-sim
    # Namespace where the application will be deployed (defaults to helm release namespace if not specified)
    namespace: ""
    # ArgoCD project (use "default" or specify your project)
    project: default

    # Helm chart source from the infra repo (git)
    source:
      # Infra repo URL (injected from .env: INFRA_REGISTRY)
      repoURL: ""
      # Path to the Helm chart within the infra repo (injected from .env: HELM_CHART_PATH/<chart>)
      path: ""
      # Git branch/tag/commit to track
      targetRevision: "HEAD"

      # Helm values overrides (image + pull-secret creds injected from .env)
      helm:
        # Static YAML values (safe to commit — no secrets)
        values: |
          github:
            pullSecret:
              # Disabled by default; enable by setting parameters below
              create: false
        # Sensitive / environment-specific parameters passed via --set equivalent.
        # These should be set in your environment-specific values file or via
        # ArgoCD UI "Edit as YAML" / "Parameters" tab.
        #
        # Example:
        # parameters:
        #   - name: image.repository
        #     value: <CONTAINER_REGISTRY>/<CONTAINER_IMAGE> (from .env)
        #   - name: github.pullSecret.create
        #     value: "true"
        #   - name: github.pullSecret.registry
        #     value: <CONTAINER_REGISTRY> (from .env)
        #   - name: github.pullSecret.username
        #     value: your-quay-robot-username
        #   - name: github.pullSecret.token
        #     value: your-quay-robot-token
        #   - name: route.host
        #     value: df-sim.apps.rigel.app
        parameters: []

    # Destination cluster and namespace
    destination:
      # Kubernetes cluster (use "in-cluster" for the same cluster as ArgoCD)
      server: https://kubernetes.default.svc
      # Target namespace
      namespace: df-sim

    # Sync policy
    syncPolicy:
      # Automatically sync when changes are detected
      automated:
        # Automatically create namespace if it doesn't exist
        prune: true
        # Allow empty resources
        selfHeal: true
        # Allow resources to be deleted
        allowEmpty: false

      # Sync options
      syncOptions:
        - CreateNamespace=true
        - PrunePropagationPolicy=foreground
        - PruneLast=true
        - RespectIgnoreDifferences=false

      # Retry policy
      retry:
        limit: 5
        backoff:
          duration: 5s
          factor: 2
          maxDuration: 3m

      # Metadata applied to the auto-created destination namespace.
      # The managed-by label grants the OpenShift GitOps controller RBAC to
      # manage resources in the target namespace. The value MUST match the
      # namespace where the GitOps instance / application-controller runs.
      managedNamespaceMetadata:
        labels:
          argocd.argoproj.io/managed-by: openshift-gitops
