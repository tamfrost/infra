apiVersion: v1
kind: Service
metadata:
  name: {{ include "df-sim.fullname" . }}
  labels:
    {{- include "df-sim.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.dfServerPort }}
      targetPort: dfserver
      protocol: TCP
      name: dfserver
  selector:
    {{- include "df-sim.selectorLabels" . | nindent 4 }}
