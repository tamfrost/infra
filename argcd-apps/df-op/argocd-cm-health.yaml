# Merge patch for argocd-cm: DfStack health from its status conditions.
#   kubectl -n argocd patch configmap argocd-cm --type merge --patch-file argocd-cm-health.yaml
data:
  resource.customizations.health.df.jolundq.se_DfStack: |
    hs = {status = "Progressing", message = "Waiting for the df-op operator"}
    if obj.status ~= nil and obj.status.conditions ~= nil then
      for _, c in ipairs(obj.status.conditions) do
        if c.type == "Reconciled" and c.status == "False" then
          return {status = "Degraded", message = c.message}
        end
      end
      for _, c in ipairs(obj.status.conditions) do
        if c.type == "Ready" then
          hs.message = c.message
          if c.status == "True" then hs.status = "Healthy" end
        end
      end
    end
    return hs
