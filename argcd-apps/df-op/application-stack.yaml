# The DfStack: df-lob + df-sim. Git and the console share it:
#   - git (manifests/df-op/stack/dfstack.yaml) holds only the image tags,
#     which the df-lob/df-sim workflows bump; each new commit is synced.
#   - everything else is edited in the console (Installed Operators -> DF Stack).
# Server-side apply makes Argo CD touch only the fields in git, and selfHeal
# is off so console edits aren't reverted between commits.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: df-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tamfrost/infra
    path: manifests/df-op/stack
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: df
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    # Retries until the df-op operator (OLM) has installed the DfStack CRD
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
