# df-op operator: CRD, RBAC and Deployment, rendered and pinned to the image
# by the df-op workflow on every push.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: df-op
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tamfrost/infra
    path: manifests/df-op/operator
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: df-op-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # The CRD is ~190 KB, too close to the 256 KB last-applied annotation limit
      - ServerSideApply=true
