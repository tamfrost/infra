# df-op operator, installed through OLM: Argo CD keeps the CatalogSource and
# Subscription in place, OLM installs and upgrades the operator from them.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: df-op
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tamfrost/infra
    path: manifests/df-op/olm
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-operators
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
