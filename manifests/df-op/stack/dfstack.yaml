# Git holds only the image tags; the app workflows bump them and
# Argo CD syncs each commit (server-side apply, so nothing else is touched).
# Every other setting is managed in the console: Installed Operators ->
# DF Stack -> df. Keep the indentation: the workflows edit the tag: lines.
apiVersion: df.jolundq.se/v1alpha1
kind: DfStack
metadata:
  name: df
  namespace: df
spec:
  lob:
    image:
      tag: "b5b0987"
  sim:
    image:
      tag: "851de06"
  fix:
    image:
      tag: "59ea039"
  proxy:
    image:
      tag: "7ad9aef"
