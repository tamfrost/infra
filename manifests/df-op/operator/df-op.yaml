metadata:
  labels:
    app.kubernetes.io/name: df-op
  name: df-op-controller-manager
  namespace: df-op-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: df-op
  template:
    metadata:
      labels:
        app.kubernetes.io/name: df-op
    spec:
      containers:
      - args:
        - --health-probe-bind-address=:8081
        image: ghcr.io/tamfrost/df-op:5ad338c
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      imagePullSecrets:
      - name: ghcr
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: df-op-controller-manager
      terminationGracePeriodSeconds: 10
